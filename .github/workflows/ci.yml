name: CI

on:
  push:
    branches: [main]
  pull_request:

# 読み取りだけ。依存のコードが動くジョブに書き込み権限を渡さない
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Action はタグの付け替えに影響されないようコミット SHA で固定する（公開から7日以上たった版）
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # .npmrc（min-release-age、ignore-scripts）と package-lock.json の integrity がここでも効く
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run sim
      - run: npm run build
